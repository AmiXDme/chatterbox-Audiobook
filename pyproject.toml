[project]
name = "chatterbox-tts"
version = "0.1.1"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    "numpy>=1.26.0",
    "resampy>=0.4.3",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "tqdm>=4.65.0",
    "gradio>=5.0.0",
    "qrcode>=7.4.0",
    "s3tokenizer",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.46.0",
    "diffusers>=0.29.0",
    "resemble-perth>=1.0.1",
    "omegaconf>=2.3.0",
    "conformer>=0.3.2",
    "spacy>=3.4.0",
]

[project.optional-dependencies]
advanced-nlp = ["spacy[en_core_web_sm]>=3.4.0"]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
